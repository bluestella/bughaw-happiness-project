name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Known-vulnerability check on production dependencies. It reports but does not fail the
      # build yet: passkit-generator/joi (dormant Wallet passes) have an open advisory whose fix
      # is a major change (docs/security.md §11). Make this blocking once that is resolved.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Playwright @smoke subset against a throwaway local Supabase (docs/ui-testing.md).
  # Global teardown deletes everything the run created and fails on leftovers;
  # the stack is then destroyed outright (§1.1).
  e2e-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: ./scripts/e2e/env.sh
      - run: npm run typecheck:e2e
      # Real RLS policies and function guards, every role (docs/testing.md §5).
      - run: npm run test:access
      # Fails when a migration changed the schema but the generated types were not refreshed.
      - run: npm run db:types && git diff --exit-code -- src/lib/supabase/types.ts
      - run: npm run e2e:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - if: always()
        run: supabase stop --no-backup
